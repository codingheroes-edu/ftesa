<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arlinda & Ermal — The Wedding</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ivory: #faf6ed;
        --paper: #fffdf9;
        --ink: #2a241d;
        --ink-soft: #5c5346;
        --gold: #c79a4b;
        --gold-light: #ecd4a0;
        --gold-deep: #9c7530;
        --wax: #6e2530;
        --wax-deep: #3e1119;
        --rule: rgba(184, 147, 90, 0.35);
        --red: #6f0606;
        --red-light: #8f1414;
        --red-deep: #470303;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background-color: var(--ivory);
        background-image: radial-gradient(circle at 50% 20%, #fffef9 0%, #f2ebdb 100%);
        font-family: "Jost", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
        overflow: hidden;
        position: relative;
      }

      .bg-glow,
      .bg-glow-2 {
        position: absolute;
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
        animation: drift 22s infinite alternate ease-in-out;
      }
      .bg-glow {
        width: 620px;
        height: 620px;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.07) 0%, rgba(255, 255, 255, 0) 70%);
        top: -12%;
        left: -8%;
      }
      .bg-glow-2 {
        width: 520px;
        height: 520px;
        background: radial-gradient(circle, rgba(110, 37, 48, 0.05) 0%, rgba(255, 255, 255, 0) 70%);
        bottom: -12%;
        right: -8%;
        animation-duration: 27s;
        animation-direction: alternate-reverse;
      }
      @keyframes drift {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 18px) scale(1.05); }
      }

      /* ============ LANDSCAPE ENVELOPE ============ */
      .scene {
        width: min(720px, 94vw);
        aspect-ratio: 8 / 5;
        z-index: 1;
        perspective: 2000px;
      }

      .envelope {
        width: 100%;
        height: 100%;
        position: relative;
        background: linear-gradient(160deg, var(--red-light) 0%, var(--red) 55%, var(--red-deep) 100%);
        border-radius: 6px;
        box-shadow: 0 35px 80px rgba(40, 5, 5, 0.45), 0 2px 0 rgba(199, 154, 75, 0.25);
        border: 1px solid rgba(199, 154, 75, 0.45);
        transform-style: preserve-3d;
      }
      /* fine gold inset trim, classic envelope stationery detail */
      .envelope::before {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(199, 154, 75, 0.55);
        border-radius: 3px;
        pointer-events: none;
        z-index: 7;
      }

      /* Envelope-back seam lines: four flaps folding to a shared center point */
      .seams {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
      }

      /* Bottom flap fill (static, sits under the top flap) */
      .pocket {
        position: absolute;
        inset: 0;
        background: linear-gradient(0deg, var(--red-deep) 0%, var(--red) 65%);
        border-radius: 6px;
        z-index: 2;
      }

      /* Left / right flap shading — subtle tonal shift so each panel reads as its own folded piece */
      .side-fold {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        z-index: 2;
        pointer-events: none;
      }
      .side-fold.left {
        left: 0;
        clip-path: polygon(0 0, 0 100%, 100% 50%);
        background: linear-gradient(100deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.12));
      }
      .side-fold.right {
        right: 0;
        clip-path: polygon(100% 0, 100% 100%, 0 50%);
        background: linear-gradient(260deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.12));
      }

      /* Top flap — opens, reaches the shared center point */
      .flap {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 54%;
        background: linear-gradient(165deg, var(--red-light) 0%, var(--red) 100%);
        border: 1px solid rgba(199, 154, 75, 0.35);
        border-bottom: none;
        border-radius: 6px 6px 0 0;
        clip-path: polygon(0 0, 50% 92.5%, 100% 0);
        transform-origin: top center;
        transition: transform 1.3s cubic-bezier(0.4, 0, 0.2, 1);
        filter: drop-shadow(0 4px 6px rgba(20, 2, 2, 0.4));
        z-index: 4;
      }

      .envelope.open .flap {
        transform: rotateX(178deg);
        z-index: 1;
      }

      /* ============ WAX SEAL ============ */
      .seal-wrap {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: clamp(78px, 16vw, 122px);
        height: clamp(78px, 16vw, 122px);
        z-index: 6;
        cursor: pointer;
        transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .seal-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 10px 12px rgba(20, 2, 2, 0.5));
      }
      .music-toggle {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 8;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid rgba(199, 154, 75, 0.6);
        background: rgba(74, 5, 5, 0.55);
        color: var(--gold-light);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease 0.4s, transform 0.25s;
      }
      .music-toggle.muted { color: rgba(233, 207, 156, 0.4); }
      .music-toggle:hover { transform: scale(1.08); }
      .envelope.open .music-toggle {
        opacity: 1;
        pointer-events: auto;
      }

      .seal-initials {
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: clamp(1.15em, 4.4vw, 1.7em);
        letter-spacing: 1px;
        color: #e9cf9c;
        text-shadow: 0 1px 0 rgba(255, 240, 210, 0.35), 0 -1px 1px rgba(30, 4, 4, 0.65);
        pointer-events: none;
        user-select: none;
      }
      .seal-wrap:hover {
        transform: translate(-50%, -50%) scale(1.05) rotate(-2deg);
      }
      .envelope.open .seal-wrap {
        animation: sealBreak 1.1s cubic-bezier(0.6, 0.02, 0.7, 0.2) forwards;
      }
      @keyframes sealBreak {
        0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        30% { transform: translate(-50%, -60%) scale(1.08) rotate(-10deg); opacity: 1; }
        100% { transform: translate(-50%, 60%) scale(0.15) rotate(340deg); opacity: 0; }
      }

      
      .tap-hint {
        position: absolute;
        top: 50%;
        margin-top: clamp(52px, 11vw, 78px);
        width: 100%;
        text-align: center;
        color: var(--gold-light);
        font-size: 0.72em;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        text-shadow: 0 1px 3px rgba(20, 2, 2, 0.6);
        z-index: 5;
        pointer-events: none;
        transition: opacity 0.4s;
      }
      .envelope.open .tap-hint {
        opacity: 0;
      }

      /* ============ INVITATION CARD ============ */
      .invitation-card {
        position: absolute;
        inset: 10px;
        border-radius: 4px;
        z-index: 2;
        opacity: 0;
        transform: translateY(28px);
        transition: opacity 1s ease 0.55s, transform 1.3s cubic-bezier(0.19, 1, 0.22, 1) 0.55s;
        background:
          linear-gradient(rgba(255, 253, 249, 0.82), rgba(255, 253, 249, 0.86)),
          url("background.jpg") center 38% / cover no-repeat;
        overflow: hidden;
      }
      .invitation-card::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid var(--rule);
        pointer-events: none;
        z-index: 3;
      }
      /* thin corner brackets, quiet stationery detail */
      .corner {
        position: absolute;
        width: 18px;
        height: 18px;
        border: 1px solid var(--gold);
        opacity: 0.55;
        z-index: 3;
        pointer-events: none;
      }
      .corner.tl { top: 5px; left: 5px; border-right: none; border-bottom: none; }
      .corner.tr { top: 5px; right: 5px; border-left: none; border-bottom: none; }
      .corner.bl { bottom: 5px; left: 5px; border-right: none; border-top: none; }
      .corner.br { bottom: 5px; right: 5px; border-left: none; border-top: none; }

      .envelope.open .invitation-card {
        opacity: 1;
        z-index: 5;
        transform: translateY(0);
      }

      .view-pane {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: clamp(6px, 1.4vh, 12px);
        position: relative;
        padding: 26px 34px;
        z-index: 2;
      }
      .hidden {
        display: none !important;
      }

      .eyebrow {
        font-family: "Jost", sans-serif;
        font-weight: 400;
        font-size: 0.68em;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .main-names {
        font-family: "Cormorant Garamond", serif;
        font-weight: 500;
        font-size: clamp(1.9em, 5.4vw, 2.7em);
        color: var(--ink);
        text-align: center;
        line-height: 1;
      }
      .main-names em {
        font-style: italic;
        font-weight: 400;
        color: var(--gold-deep);
        font-size: 0.7em;
        margin: 0 6px;
      }

      .divider {
        width: min(280px, 70%);
        height: 24px;
      }
      .divider svg { width: 100%; height: 100%; display: block; }

      .details-block {
        text-align: center;
      }
      .details-block p {
        color: var(--ink-soft);
        font-family: "Jost", sans-serif;
        font-size: 0.82em;
        font-weight: 300;
        line-height: 1.55;
      }
      .details-block strong {
        font-family: "Cormorant Garamond", serif;
        color: var(--ink);
        font-weight: 600;
        font-size: 1.15em;
      }
      .location-accent {
        color: var(--gold-deep) !important;
        margin-top: 3px;
        letter-spacing: 0.5px;
      }

      .ring-icon {
        width: 46px;
        height: 22px;
        opacity: 0.9;
      }

      .countdown-modern {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
        width: min(320px, 90%);
      }
      .time-unit {
        background: var(--ivory);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 8px 2px;
        text-align: center;
      }
      .time-unit span {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.25em;
        font-weight: 600;
        color: var(--ink);
        display: block;
      }
      .time-unit small {
        font-size: 0.48em;
        color: var(--ink-soft);
        letter-spacing: 1.5px;
        display: block;
        font-family: "Jost", sans-serif;
      }

      .btn-modern {
        background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
        color: #fffdf9;
        border: none;
        padding: 12px 30px;
        border-radius: 2px;
        font-size: 0.72em;
        font-weight: 500;
        font-family: "Jost", sans-serif;
        letter-spacing: 2.5px;
        cursor: pointer;
        text-transform: uppercase;
        box-shadow: 0 6px 16px rgba(139, 107, 58, 0.28);
        transition: all 0.3s;
      }
      .btn-modern:hover {
        transform: translateY(-1px);
        box-shadow: 0 9px 20px rgba(139, 107, 58, 0.4);
      }
      .btn-secondary {
        background: transparent;
        border: 1px solid var(--rule);
        color: var(--ink-soft);
        box-shadow: none;
        margin-top: 4px;
      }

      .rsvp-form {
        width: min(320px, 92%);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px 12px;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 2px;
        color: var(--ink);
        font-family: "Jost", sans-serif;
        font-size: 0.82em;
        outline: none;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: var(--gold);
      }
      .conditional-field {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out;
      }
      .conditional-field.show {
        max-height: 60px;
      }
      .form-actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .form-actions .btn-modern { flex: 1; }

      /* ============ RESPONSIVE / MOBILE ============ */
      @media (max-width: 700px) {
        .scene {
          width: 96vw;
          aspect-ratio: 4 / 3.3;
          max-height: 90vh;
        }
        .view-pane { padding: 16px 18px; gap: clamp(4px, 1.1vh, 8px); }
        .details-block p { font-size: 0.78em; line-height: 1.45; }
        .divider { width: min(240px, 78%); height: 20px; }
        .countdown-modern { gap: 5px; }
        .time-unit { padding: 6px 2px; }
        .btn-modern { padding: 11px 24px; font-size: 0.68em; }
      }

      @media (max-width: 420px) {
        body { padding: 12px; }
        .scene { aspect-ratio: 3 / 3; }
        .view-pane { padding: 14px 14px; }
        .main-names { font-size: clamp(1.5em, 8vw, 2em); }
        .main-names em { font-size: 0.65em; }
        .eyebrow { font-size: 0.6em; letter-spacing: 2px; }
        .ring-icon { width: 38px; height: 18px; }
        .details-block strong { font-size: 1.05em; }
        .countdown-modern { grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .time-unit span { font-size: 1.05em; }
        .time-unit small { font-size: 0.44em; }
      }

      /* very short / cramped viewports: allow the pane to scroll instead of clipping */
      @media (max-height: 620px) {
        .view-pane { overflow-y: auto; justify-content: flex-start; padding-top: 20px; }
      }

      @media (hover: none) {
        .seal-wrap:active { transform: translate(-50%, -50%) scale(0.97); }
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="scene">
      <div class="envelope" id="envelopeContainer">
        <div class="side-fold left"></div>
        <div class="side-fold right"></div>
        <div class="pocket"></div>
        <div class="seams">
          <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="0" y1="0" x2="50" y2="50" stroke="rgba(217, 178, 110, 0.55)" stroke-width="0.4" />
            <line x1="100" y1="0" x2="50" y2="50" stroke="rgba(217, 178, 110, 0.55)" stroke-width="0.4" />
            <line x1="0" y1="100" x2="50" y2="50" stroke="rgba(217, 178, 110, 0.45)" stroke-width="0.4" />
            <line x1="100" y1="100" x2="50" y2="50" stroke="rgba(217, 178, 110, 0.45)" stroke-width="0.4" />
          </svg>
        </div>
        <div class="flap"></div>

        <!-- WAX SEAL -->
        <div class="seal-wrap" onclick="openEnvelope()">
          <img src="seal.png" alt="Wax seal" />
          <span class="seal-initials">A&amp;E</span>
        </div>
        <div class="tap-hint">Shtyp Vulën</div>

        <button id="musicToggle" class="music-toggle" onclick="toggleMusic(event)" aria-label="Toggle music" title="Toggle music">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </button>

        <!-- INVITATION CARD -->
        <div class="invitation-card">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>

          <div id="invitationView" class="view-pane">
            <p class="eyebrow">Ftesë Martese</p>
            <h1 class="main-names">Arlinda <em>&amp;</em> Ermali</h1>

            <div class="divider">
              <svg viewBox="0 0 320 30" xmlns="http://www.w3.org/2000/svg" fill="none">
                <line x1="0" y1="15" x2="128" y2="15" stroke="var(--gold)" stroke-width="1" opacity="0.6" />
                <g fill="var(--gold)">
                  <path d="M100,15 C102,10 107,10 109,15 C107,20 102,20 100,15 Z" />
                  <path d="M80,15 C82,9 88,9 90,15 C88,21 82,21 80,15 Z" />
                  <path d="M58,15 C60,8 67,8 69,15 C67,22 60,22 58,15 Z" />
                  <path d="M36,15 C38,7 46,7 48,15 C46,23 38,23 36,15 Z" />
                </g>
                <circle cx="160" cy="15" r="4.5" fill="none" stroke="var(--gold)" stroke-width="1" />
                <circle cx="160" cy="15" r="1.6" fill="var(--gold)" />
                <line x1="192" y1="15" x2="320" y2="15" stroke="var(--gold)" stroke-width="1" opacity="0.6" />
                <g fill="var(--gold)">
                  <path d="M220,15 C218,10 213,10 211,15 C213,20 218,20 220,15 Z" />
                  <path d="M240,15 C238,9 232,9 230,15 C232,21 238,21 240,15 Z" />
                  <path d="M262,15 C260,8 253,8 251,15 C253,22 260,22 262,15 Z" />
                  <path d="M284,15 C286,7 278,7 276,15 C278,23 286,23 284,15 Z" />
                </g>
              </svg>
            </div>

            <div class="details-block">
              <p>Kërkojmë nderin e pranisë suaj</p>
              <p>në festimin e martesës sonë</p>
              <p style="margin-top: 6px"><strong>Të mërkurën, më 22 korrik 2026</strong></p>
              <p>Në orën tetë pasdite | 20:00</p>
              <p class="location-accent"><strong>Grand Palace Hall</strong> &bull; Skopje</p>
            </div>

            <svg class="ring-icon" viewBox="0 0 64 32" xmlns="http://www.w3.org/2000/svg" fill="none">
              <circle cx="24" cy="16" r="11" stroke="var(--gold-deep)" stroke-width="1.4" />
              <circle cx="40" cy="16" r="11" stroke="var(--gold)" stroke-width="1.4" />
              <path d="M24,6 L26,9 L24,11 L22,9 Z" fill="var(--gold-light)" />
            </svg>

            <div class="countdown-modern" id="countdown">
              <div class="time-unit"><span id="days">00</span><small>DAYS</small></div>
              <div class="time-unit"><span id="hours">00</span><small>HRS</small></div>
              <div class="time-unit"><span id="minutes">00</span><small>MINS</small></div>
              <div class="time-unit"><span id="seconds">00</span><small>SEC</small></div>
            </div>

            <button class="btn-modern" onclick="switchView('rsvpView')">Konfirmo</button>
          </div>

          <div id="rsvpView" class="view-pane hidden">
            <p class="eyebrow">Ju lutem konfirmoni deri para 15 Korrikut</p>
            <h1 class="main-names" style="font-size: clamp(1.4em, 3.6vw, 1.9em)">A do të merrni pjesë?</h1>

            <form action="https://formsubmit.co/albulena.adilii7@gmail.com" method="POST" class="rsvp-form">
              <div class="form-group">
                <input type="text" name="name" placeholder="Emri dhe Mbiemri" required />
              </div>
              <div class="form-group">
                <select name="attendance" onchange="checkAttendance(this.value)" required>
                  <option value="" disabled selected>A do të merrni pjesë?</option>
                  <option value="accept">Patjetër</option>
                  <option value="decline">Jo</option>
                </select>
              </div>
              <div class="conditional-field" id="dietaryField">
                <div class="form-group">
                  <input type="text" name="dietary" placeholder="Dietary restrictions / Allergies" />
                </div>
              </div>
              <div class="form-group">
                <input type="number" name="guests" placeholder="Number of Guests" min="1" max="5" value="1" />
              </div>
              <div class="form-actions">
                <button type="button" class="btn-modern btn-secondary" onclick="switchView('invitationView')">Back</button>
                <button type="submit" class="btn-modern">Confirm</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- hidden YouTube player, provides audio only -->
    <div id="yt-player" style="position:absolute; width:16px; height:9px; overflow:hidden; opacity:0; pointer-events:none;"></div>

    <script>
      const YT_VIDEO_ID = "F2xnvyMp8Us";
      let ytPlayer = null;
      let ytReady = false;
      let playRequested = false;

      

      function openEnvelope() {
        document.getElementById("envelopeContainer").classList.add("open");
        const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);

      window.onYouTubeIframeAPIReady = function () {
        ytPlayer = new YT.Player("yt-player", {
          height: "9",
          width: "16",
          videoId: YT_VIDEO_ID,
          playerVars: {
            autoplay: 1,
            controls: 0,
            playsinline: 1,
            origin: window.location.origin,
          },
          events: {
            onReady: function () {
              ytReady = true;
              if (playRequested) {
                ytPlayer.playVideo();
              }
            },
          },
        });
      };
      }

      function toggleMusic(event) {
        event.stopPropagation();
        const btn = document.getElementById("musicToggle");
        playRequested = true;

        if (!ytReady || !ytPlayer || !ytPlayer.playVideo) {
          // API/player still loading — it will auto-play as soon as it's ready
          btn.classList.remove("muted");
          return;
        }

        const state = ytPlayer.getPlayerState();
        if (state === 1) {
          // currently playing -> pause
          ytPlayer.pauseVideo();
          btn.classList.add("muted");
        } else {
          ytPlayer.playVideo();
          btn.classList.remove("muted");
        }
      }

      function switchView(targetId) {
        const pane1 = document.getElementById("invitationView");
        const pane2 = document.getElementById("rsvpView");
        if (targetId === "rsvpView") {
          pane1.classList.add("hidden");
          pane2.classList.remove("hidden");
        } else {
          pane2.classList.add("hidden");
          pane1.classList.remove("hidden");
        }
      }

      function checkAttendance(value) {
        const field = document.getElementById("dietaryField");
        if (value === "accept") {
          field.classList.add("show");
        } else {
          field.classList.remove("show");
        }
      }

      const WEDDING_DATE = new Date("Jul 22, 2026 20:00:00").getTime();
      function updateCountdown() {
        const now = new Date().getTime();
        const distance = WEDDING_DATE - now;
        if (distance > 0) {
          document.getElementById("days").innerText = String(Math.floor(distance / 86400000)).padStart(2, "0");
          document.getElementById("hours").innerText = String(Math.floor((distance % 86400000) / 3600000)).padStart(2, "0");
          document.getElementById("minutes").innerText = String(Math.floor((distance % 3600000) / 60000)).padStart(2, "0");
          document.getElementById("seconds").innerText = String(Math.floor((distance % 60000) / 1000)).padStart(2, "0");
        } else {
          document.getElementById("countdown").innerHTML =
            "<p style='grid-column: span 4; color: var(--gold-deep); font-family: Cormorant Garamond, serif; font-size: 1.1em; text-align:center;'>Forever Commenced</p>";
        }
      }
      setInterval(updateCountdown, 1000);
      updateCountdown();
    </script>
  </body>
</html>
